name: "Copilot Setup Steps"

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/**
      - configs/**
      - settings/**
      - src/**
      - utilities/**
      - package.json
      - package-lock.json
      - playwright.config.ts
      - tsconfig.json
  pull_request:
    paths:
      - .github/workflows/**
      - configs/**
      - settings/**
      - src/**
      - utilities/**
      - package.json
      - package-lock.json
      - playwright.config.ts
      - tsconfig.json

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v6

    - uses: actions/setup-node@v6
      with:
        node-version: lts/*
        cache: npm

    - name: Install dependencies
      run: npm ci

    - name: Install Playwright Browsers
      run: npx playwright install --with-deps

    - name: Typecheck
      run: npm run typecheck

    - name: Generate BDD tests
      run: npm run test:generate-bdd

    - name: Run GraphQL suite
      run: npx playwright test --project=suit3 --reporter=line

    - name: Upload test artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-test-results
        path: out/test-results/
        if-no-files-found: ignore
        retention-days: 14
